[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-island"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "psutil>=5.9",
    "watchdog>=4.0",
    "transitions>=0.9",
    "platformdirs>=4.0",
    # State broadcast layer: BehaviorSubject for the WorldSnapshot stream
    # and QtScheduler for marshaling renders onto the Qt main thread.
    # Pure Python (py3-none-any wheel), no native deps — Windows + macOS
    # + Linux ship the same package. Pin <5 so a future major bump can't
    # silently break the operator pipeline (we only use 4 ops, but the
    # API stability guarantee only covers v4.x).
    "reactivex>=4.1,<5",
    "pywin32>=306; sys_platform == 'win32'",
    "uiautomation>=2.0; sys_platform == 'win32'",
    # macOS-only: lets us mutate NSBundle.infoDictionary at runtime so the
    # app runs as LSBackgroundOnly (no dock icon, no Cmd-Tab entry, no
    # menu-bar title). Without this the user sees the generic Python file
    # icon labelled "python3" — confusing and ugly. The capsule itself is
    # the persistent affordance, mirroring Bartender / BetterTouchTool /
    # Alfred. Graceful degrade: if pyobjc isn't installed (manual install
    # path), the dock icon stays but the app still works.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1",
    "pytest>=8.0",
    "pytest-qt>=4.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.setuptools.packages.find]
where = ["."]
include = ["claude_island*"]

[tool.importlinter]
root_packages = ["claude_island"]
include_external_packages = true

# P2: Core never touches UI frameworks or OS-specific libs.
# reactivex is allowed — pure Python, no UI / OS dependency. It carries
# the WorldSnapshot broadcast Subject; the QtScheduler binding lives in
# the UI layer (__main__.py wiring), not in core.
[[tool.importlinter.contracts]]
name = "core must not import UI frameworks"
type = "forbidden"
source_modules = ["claude_island.core"]
forbidden_modules = ["PySide6", "PyQt6", "PyQt5"]

# P4: Acyclic — core is the stable centre, platform_ and ui are leaves
[[tool.importlinter.contracts]]
name = "core must not import platform layer"
type = "forbidden"
source_modules = ["claude_island.core"]
forbidden_modules = ["claude_island.platform_"]

[[tool.importlinter.contracts]]
name = "ui must not import platform layer"
type = "forbidden"
source_modules = ["claude_island.ui"]
forbidden_modules = ["claude_island.platform_"]

[[tool.importlinter.contracts]]
name = "platform must not import ui layer"
type = "forbidden"
source_modules = ["claude_island.platform_"]
forbidden_modules = ["claude_island.ui"]
